<script>/* apply the saved theme before first paint to avoid a light flash */
(function(){try{var t=JSON.parse(localStorage.getItem('msoca:theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();</script>
